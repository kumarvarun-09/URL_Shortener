<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>URL Shortener</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        /* =========================
           LIGHT MODE (DEFAULT)
        ========================== */

        body {
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            transition: 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 22px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            transition: 0.3s ease;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 6px;
            color: #111;
        }

        p {
            font-size: 13px;
            color: #666;
            margin-bottom: 18px;
            line-height: 1.4;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            margin-bottom: 12px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #4a90e2;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .generate-btn {
            background: #4a90e2;
            color: white;
        }

        .generate-btn:hover {
            background: #357bd8;
        }

        .generate-btn:disabled {
            background: #a9c7f5;
            cursor: not-allowed;
        }

        .loading,
        .success,
        .error {
            margin-top: 10px;
            font-size: 13px;
        }

        .loading {
            display: none;
            color: #777;
        }

        .success {
            display: none;
            color: #16a34a;
        }

        .error {
            display: none;
            color: #dc2626;
        }

        .result-box {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border: 1px solid #eee;
            border-radius: 10px;
            background: #fafafa;
            text-align: left;
        }

        .label {
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
        }

        .url {
            font-size: 14px;
            color: #1a73e8;
            word-break: break-all;
            margin-bottom: 10px;
        }

        .btn-row {
            display: flex;
            gap: 10px;
        }

        .copy-btn {
            flex: 1;
            background: #22c55e;
            color: white;
        }

        .open-btn {
            flex: 1;
            background: #111827;
            color: white;
        }

        /* =========================
           DARK MODE
        ========================== */

        body.dark {
            background: #0f172a;
        }

        body.dark .container {
            background: #1e293b;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        body.dark h1 {
            color: #f1f5f9;
        }

        body.dark p {
            color: #cbd5e1;
        }

        body.dark input {
            background: #0f172a;
            border: 1px solid #334155;
            color: #f1f5f9;
        }

        body.dark input:focus {
            border-color: #60a5fa;
        }

        body.dark .result-box {
            background: #0f172a;
            border-color: #334155;
        }

        body.dark .url {
            color: #60a5fa;
        }

        body.dark .open-btn {
            background: #e2e8f0;
            color: #0f172a;
        }

        body.dark .open-btn:hover {
            background: #cbd5e1;
        }

        /* =========================
           TOGGLE BUTTON
        ========================== */

        .toggle-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            width: auto;
            padding: 8px 12px;
            font-size: 12px;
            background: #111827;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        body.dark .toggle-btn {
            background: #f1f5f9;
            color: #0f172a;
        }
    </style>
</head>

<body>

<button class="toggle-btn" id="themeToggle" onclick="toggleDarkMode()">
    🌙 Dark Mode
</button>

<div class="container">

    <h1>🔗 URL Shortener</h1>
    <p>Paste your long URL and generate a short link</p>

    <input type="text" id="urlInput" placeholder="https://example.com"/>

    <button class="generate-btn" id="generateBtn" onclick="generate()">
        Generate Short URL
    </button>

    <div class="loading" id="loading">Generating short URL...</div>
    <div class="success" id="success"></div>
    <div class="error" id="error"></div>

    <div class="result-box" id="resultBox">
        <div class="label">Your Short URL</div>
        <div class="url" id="shortUrl"></div>

        <div class="btn-row">
            <button class="copy-btn" onclick="copyUrl()">Copy</button>
            <button class="open-btn" onclick="openUrl()">Open</button>
        </div>
    </div>

</div>

<script>
    let generatedUrl = "";

    // INIT THEME
    window.onload = () => {
        const theme = localStorage.getItem("theme");
        const btn = document.getElementById("themeToggle");

        if (theme === "dark") {
            document.body.classList.add("dark");
            btn.innerText = "☀️ Light Mode";
        } else {
            btn.innerText = "🌙 Dark Mode";
        }
    };

    function toggleDarkMode() {
        const body = document.body;
        const btn = document.getElementById("themeToggle");

        body.classList.toggle("dark");

        const isDark = body.classList.contains("dark");

        if (isDark) {
            localStorage.setItem("theme", "dark");
            btn.innerText = "☀️ Light Mode";
        } else {
            localStorage.setItem("theme", "light");
            btn.innerText = "🌙 Dark Mode";
        }
    }

    async function generate() {
        const url = document.getElementById("urlInput").value.trim();

        const btn = document.getElementById("generateBtn");
        const loading = document.getElementById("loading");
        const success = document.getElementById("success");
        const error = document.getElementById("error");
        const resultBox = document.getElementById("resultBox");

        success.style.display = "none";
        error.style.display = "none";
        resultBox.style.display = "none";

        if (!url) {
            showError("Please enter a URL");
            return;
        }

        btn.disabled = true;
        loading.style.display = "block";

        try {
            const response = await fetch("/url/shorten", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ url })
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.message || "Failed to generate URL");
            }

            generatedUrl = data.data;

            document.getElementById("shortUrl").innerText = generatedUrl;
            resultBox.style.display = "block";

            success.innerText = data.message || "Short URL generated!";
            success.style.display = "block";

        } catch (err) {
            showError(err.message || "Something went wrong");
        }

        btn.disabled = false;
        loading.style.display = "none";
    }

    function copyUrl() {
        navigator.clipboard.writeText(generatedUrl);
        document.getElementById("success").innerText = "Copied to clipboard!";
        document.getElementById("success").style.display = "block";
    }

    function openUrl() {
        if (generatedUrl) {
            window.open(generatedUrl, "_blank");
        }
    }

    function showError(msg) {
        const error = document.getElementById("error");
        error.innerText = msg;
        error.style.display = "block";
    }
</script>

</body>
</html>
